<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Frontend Mentor | Age calculator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="container">
    
      <div class="sub-container">
        <div class="sub-container1">
          <label for="day" class="text" id="day-text-error"> DAY</label>
          <input type="number" placeholder="DD" id="day" max="31" min="1"/>
          <span style="display: none;" id="day-error">This field is required</span>
        </div>
        <div class="sub-container1">
          <label for="month" class="text" id="month-text-error">MONTH</label>
          <input type="number" placeholder="MM" max="12" min="1" id="month"/>
           <span style="display: none;" id="month-error">This field is required</span>
        </div>
        <div class="sub-container1">
          <label for="year" class="text" id="year-text-error">YEAR</label>
          <input type="number" placeholder="YYYY" id="year" min="0000" max="2026"/>
           <span style="display: none;" id="year-error">This field is required</span>
        </div>
      </div>
      <div style="display: flex;flex-direction: column;">
        <div style="display: flex; align-items: center;">
        <hr>
        <img src="assets/images/icon-arrow.svg" alt="" id="btn">
      </div>
      <div style="padding: 2rem;margin-top: -1rem;">
        <div>
          <span class="dashes" id="year-field">--</span>
          <span class="result-text">years</span>
        </div>
        <div>
          <span class="dashes" id="month-field">--</span>
          <span class="result-text" >months</span>
        </div>
        <div>
          <span class="dashes" id="day-field">--</span>
          <span class="result-text">days</span>
        </div>
      </div>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
